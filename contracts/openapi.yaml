openapi: 3.1.0
info:
  title: SolarRooftop AI API
  version: 0.1.0
  description: |
    HTTP API built by P3 (backend/api/handler.py), called by P4's web app.
    Every route needs a Cognito JWT in `Authorization: Bearer <token>` (ID or access token from Amplify's fetchAuthSession()).
    Errors are always `{"error": "<message>"}` (batch 400s add `invalid`).
servers:
  - url: "{VITE_API_URL}"
security:
  - cognito: []
paths:
  /jobs:
    post:
      summary: Start one assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {type: object, required: [address], properties: {address: {type: string}}}
                - {type: object, required: [lat, lng], properties: {lat: {type: number}, lng: {type: number}, address: {type: string}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {type: object, properties: {job_id: {type: string}}}}}}
        "400": {description: Bad body, address not found, or outside the Delhi/NCR box (lat 28.4–28.9, lng 76.8–77.4)}
        "403": {description: Not allowed (Cedar)}
        "429": {description: Daily quota reached (Homeowner 20/day, Installer 100/day, IST days)}
    get:
      summary: My jobs, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: {type: array, items: {$ref: "#/components/schemas/JobSummary"}}
  /jobs/{id}:
    get:
      summary: One job; includes the report when done
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JobSummary"
                  - type: object
                    properties:
                      report: {description: "Contract C (contracts/fixtures/report_C.json). Only when status = done.", type: object}
                      heatmap_png_url: {type: [string, "null"], description: "Presigned HTTPS URL of report.heatmap_png_s3_uri, valid 15 min. Use with report.heatmap_bounds."}
        "404": {description: Unknown job or not yours}
  /jobs/batch:
    post:
      summary: Start many assessments (Installer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addresses]
              properties:
                addresses:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    oneOf:
                      - {type: string}
                      - {type: object, properties: {address: {type: string}, lat: {type: number}, lng: {type: number}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {type: object, properties: {job_ids: {type: array, items: {type: string}}}}}}}
        "400": {description: "Some entries invalid; nothing created. Body has invalid: [{index, input, error}]"}
        "403": {description: Homeowner account (Cedar forbids BatchCreate)}
        "429": {description: Daily quota would be exceeded}
components:
  securitySchemes:
    cognito: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    JobSummary:
      type: object
      required: [job_id, status]
      properties:
        job_id: {type: string}
        status: {enum: [queued, fetching, segmenting, simulating, done, failed]}
        address: {type: [string, "null"]}
        lat: {type: number}
        lng: {type: number}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        kw_dc: {type: number, description: only when done}
        annual_kwh: {type: number, description: only when done}
        payback_years: {type: number, description: only when done}
        error: {type: string, description: only when failed}
